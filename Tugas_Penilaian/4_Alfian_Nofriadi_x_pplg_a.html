<html>
    <head>
        <title>Soal Penilaian 4</title>
    </head>
<body>
<form action="data">
    <h1>BIODATA</h1>
    <table>
        <tr>
            <td>Nama</td>
            <td>:</td>
            <td><input type="text" name="nama" placeholder="Masukkan Nama"></td>
        </tr>
        <tr>
            <td>Kelas</td>
            <td>:</td>
            <td><input type="text" name="kelas" placeholder="Masukkan Kelas"></td>
        </tr>
        <tr>
            <td>Jurusan</td>
            <td>:</td>
            <td><select name="jurusan">
                <option>Rekayasa Perangkat Lunak</option>
                <option>Teknik Komputer dan Jaringan</option>
                <option>Desain Komunikasi Visual</option>
                <option>Akutansi</option>
                <option>Teknik Sepeda Motor</option>
                <option>Teknik Las</option>
            </select></td>
        </tr>
        <tr>
            <td>No. Absen</td>
            <td>:</td>
            <td><input type="text" name="no_absen" value="5"></td>
        </tr>
        <tr>
            <td>Password</td>
            <td>:</td>
            <td><input type="password" name="password" placeholder="Masukkan Password"></td>    
        </tr>
        <tr>
            <td colspan="3" align="left">
                <input type="reset" value="Reset">
            </td>
        </tr>
    </table>
</form>
</body>
</html>
